[package]
name = "video-compressor"
version = "0.1.1"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = { version = "0.28", features = ["default_fonts"] }
egui = "0.28"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "bmp", "gif"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"